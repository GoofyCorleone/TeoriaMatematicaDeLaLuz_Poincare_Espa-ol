<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="340" viewBox="0 0 380 340">
  <defs>
    <style>
      .curva { fill:none; stroke:#14315D; stroke-width:2; }
      .linea { stroke:#14315D; stroke-width:1.4; }
      .construccion { stroke:#9E1B32; stroke-width:1.3; stroke-dasharray:5,4; }
      .puntoAzul { fill:#14315D; }
      .punto { fill:#9E1B32; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="380" height="340" fill="white"/>

  <!-- elipsoide (vista 2D) -->
  <ellipse cx="190" cy="160" rx="130" ry="80" class="curva" transform="rotate(-15 190 160)"/>

  <!-- centro O -->
  <circle cx="190" cy="160" r="3.5" class="puntoAzul"/>
  <text x="196" y="155" class="etiqueta">O</text>

  <!-- punto P sobre el elipsoide -->
  <circle cx="92" cy="98" r="3.5" class="punto"/>
  <text x="70" y="90" class="etiquetaRoja">P</text>

  <!-- plano tangente en P -->
  <line x1="30" y1="150" x2="150" y2="40" class="linea"/>

  <!-- perpendicular O-T -->
  <line x1="190" y1="160" x2="113" y2="83" class="construccion"/>
  <circle cx="113" cy="83" r="3" class="puntoAzul"/>
  <text x="118" y="75" class="etiqueta">T</text>

  <!-- prolongacion hasta S, con OS = 1/OT (esquematico) -->
  <line x1="190" y1="160" x2="40" y2="275" class="construccion"/>
  <circle cx="40" cy="275" r="3.5" class="punto"/>
  <text x="18" y="290" class="etiquetaRoja">S</text>
</svg>
