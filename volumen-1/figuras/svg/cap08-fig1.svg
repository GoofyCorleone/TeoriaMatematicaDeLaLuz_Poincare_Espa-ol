<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340">
  <defs>
    <style>
      .solida { fill:none; stroke:#14315D; stroke-width:2.2; }
      .punteada { fill:none; stroke:#9E1B32; stroke-width:1.8; stroke-dasharray:6,4; }
      .diagonal { fill:none; stroke:#9E1B32; stroke-width:2.2; }
      .punto { fill:#14315D; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:17px; fill:#14315D; font-style:italic; }
      .angulo { fill:none; stroke:#9E1B32; stroke-width:1.2; }
    </style>
  </defs>
  <rect width="360" height="340" fill="white"/>

  <!-- O arriba, A abajo (velocidad real de la luz OA), B a la izquierda (OB, velocidad de arrastre invertida) -->
  <line x1="260" y1="40" x2="260" y2="300" class="solida"/>
  <line x1="260" y1="40" x2="90" y2="40" class="punteada"/>
  <line x1="90" y1="40" x2="90" y2="300" class="punteada"/>
  <line x1="260" y1="300" x2="90" y2="300" class="punteada"/>
  <line x1="260" y1="40" x2="90" y2="300" class="diagonal"/>

  <circle cx="260" cy="40" r="3.5" class="punto"/>
  <text x="268" y="36" class="etiqueta">O</text>
  <circle cx="260" cy="300" r="3.5" class="punto"/>
  <text x="268" y="318" class="etiqueta">A</text>
  <circle cx="90" cy="40" r="3.5" class="punto"/>
  <text x="68" y="36" class="etiqueta">B</text>
  <circle cx="90" cy="300" r="3.5" class="punto"/>
  <text x="68" y="318" class="etiqueta">C</text>

  <path d="M 260,80 A 40,40 0 0 1 230,56" class="angulo"/>
  <text x="222" y="92" class="etiqueta">&#966;</text>
</svg>
