<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340">
  <defs>
    <style>
      .solida { fill:none; stroke:#14315D; stroke-width:2.2; }
      .punteada { fill:none; stroke:#9E1B32; stroke-width:1.6; stroke-dasharray:6,4; }
      .puntofino { fill:none; stroke:#9E1B32; stroke-width:1.2; stroke-dasharray:2,3; }
      .punto { fill:#14315D; }
      .puntoRojo { fill:#9E1B32; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
    </style>
  </defs>
  <rect width="360" height="340" fill="white"/>

  <text x="178" y="30" class="etiqueta">E</text>
  <circle cx="190" cy="60" r="3.5" class="punto"/>
  <text x="198" y="56" class="etiqueta">A</text>

  <!-- cuatro rayos desde A hasta B, B'', B', B''' en el reticulo -->
  <line x1="190" y1="60" x2="110" y2="290" class="punteada"/>
  <line x1="190" y1="60" x2="150" y2="290" class="puntofino"/>
  <line x1="190" y1="60" x2="190" y2="290" class="solida"/>
  <line x1="190" y1="60" x2="230" y2="290" class="solida"/>

  <line x1="90" y1="290" x2="250" y2="290" class="solida" stroke-width="1"/>

  <circle cx="110" cy="290" r="3.5" class="puntoRojo"/>
  <text x="98" y="312" class="etiqueta">B</text>
  <circle cx="150" cy="290" r="3.5" class="punto"/>
  <text x="140" y="312" class="etiqueta">B''</text>
  <circle cx="190" cy="290" r="3.5" class="punto"/>
  <text x="182" y="312" class="etiqueta">B'</text>
  <circle cx="230" cy="290" r="3.5" class="puntoRojo"/>
  <text x="222" y="312" class="etiqueta">B'''</text>
</svg>
