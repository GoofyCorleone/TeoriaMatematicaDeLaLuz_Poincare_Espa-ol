<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <defs>
    <style>
      .elipseA { fill:none; stroke:#14315D; stroke-width:2.2; }
      .elipseB { fill:none; stroke:#9E1B32; stroke-width:2.2; }
      .eje { stroke:#4A4A4A; stroke-width:1; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
      marker#flechaAzul path { fill:#14315D; }
      marker#flechaRoja path { fill:#9E1B32; }
    </style>
    <marker id="flechaAzul" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#14315D"/>
    </marker>
    <marker id="flechaRoja" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9E1B32"/>
    </marker>
  </defs>
  <rect width="360" height="300" fill="white"/>

  <!-- ejes -->
  <line x1="30" y1="150" x2="330" y2="150" class="eje"/>
  <text x="336" y="154" class="etiqueta">x</text>
  <line x1="180" y1="20" x2="180" y2="280" class="eje"/>
  <text x="186" y="18" class="etiqueta">y</text>

  <!-- elipse 1: eje mayor horizontal (velocidad V') -->
  <ellipse cx="180" cy="150" rx="140" ry="55" class="elipseA"/>
  <!-- flecha indicando sentido de recorrido -->
  <path d="M 180,95 A 140,55 0 0 1 320,150" fill="none" class="elipseA" marker-end="url(#flechaAzul)"/>
  <text x="300" y="100" class="etiqueta">V'</text>

  <!-- elipse 2: eje mayor vertical (velocidad V''), perpendicular a la anterior -->
  <ellipse cx="180" cy="150" rx="55" ry="140" class="elipseB"/>
  <path d="M 125,150 A 55,140 0 0 0 180,290" fill="none" class="elipseB" marker-end="url(#flechaRoja)"/>
  <text x="130" y="275" class="etiquetaRoja">V''</text>
</svg>
