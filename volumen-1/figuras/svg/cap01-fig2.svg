<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340">
  <defs>
    <style>
      .eje { stroke:#14315D; stroke-width:1.8; }
      .construccion { stroke:#9E1B32; stroke-width:1.3; stroke-dasharray:5,4; }
      .segmento { stroke:#14315D; stroke-width:1.6; }
      .puntoAzul { fill:#14315D; }
      .puntoRojo { fill:#9E1B32; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:17px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family: 'CMU Serif','Georgia',serif; font-size:17px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="400" height="340" fill="white"/>

  <!-- ejes -->
  <line x1="60" y1="290" x2="60" y2="30" class="eje"/>
  <text x="66" y="34" class="etiqueta">z</text>

  <line x1="60" y1="290" x2="330" y2="230" class="eje"/>
  <text x="336" y="234" class="etiqueta">x</text>

  <line x1="60" y1="290" x2="10" y2="330" class="eje"/>
  <text x="2" y="336" class="etiqueta">y</text>

  <!-- origen O -->
  <circle cx="60" cy="290" r="3.5" class="puntoAzul"/>
  <text x="40" y="304" class="etiqueta">O</text>

  <!-- punto P cerca de O -->
  <circle cx="90" cy="265" r="3.5" class="puntoRojo"/>
  <text x="96" y="260" class="etiquetaRoja">P</text>

  <!-- punto M sobre el eje x -->
  <circle cx="200" cy="253" r="3.5" class="puntoAzul"/>
  <text x="196" y="240" class="etiqueta">M</text>

  <!-- construccion O-M y O-P -->
  <line x1="60" y1="290" x2="200" y2="253" class="construccion"/>
  <line x1="60" y1="290" x2="90" y2="265" class="construccion"/>

  <!-- triangulo mu, mu', mu'' -->
  <circle cx="205" cy="120" r="3.5" class="puntoAzul"/>
  <text x="188" y="118" class="etiqueta">&#956;</text>

  <circle cx="275" cy="95" r="3.5" class="puntoAzul"/>
  <text x="282" y="92" class="etiqueta">&#956;'</text>

  <circle cx="245" cy="65" r="3.5" class="puntoAzul"/>
  <text x="252" y="62" class="etiqueta">&#956;''</text>

  <line x1="205" y1="120" x2="275" y2="95" class="segmento"/>
  <line x1="275" y1="95" x2="245" y2="65" class="segmento"/>
  <line x1="205" y1="120" x2="245" y2="65" class="construccion"/>
</svg>
