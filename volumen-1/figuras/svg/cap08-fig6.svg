<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <defs>
    <style>
      .frontera { stroke:#4A4A4A; stroke-width:1.4; }
      .camino { fill:none; stroke:#14315D; stroke-width:2.2; }
      .punto { fill:#14315D; }
      .puntoRojo { fill:#9E1B32; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:17px; fill:#14315D; font-style:italic; }
      .etiquetaGris { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#4A4A4A; font-style:italic; }
    </style>
  </defs>
  <rect width="360" height="300" fill="white"/>

  <!-- frontera horizontal E-F -->
  <line x1="30" y1="160" x2="330" y2="160" class="frontera"/>
  <text x="14" y="164" class="etiquetaGris">E</text>
  <text x="336" y="164" class="etiquetaGris">F</text>

  <!-- A arriba, B abajo, camino que cruza por C/C' -->
  <circle cx="300" cy="40" r="3.5" class="punto"/>
  <text x="308" y="38" class="etiqueta">A</text>
  <circle cx="90" cy="270" r="3.5" class="punto"/>
  <text x="68" y="288" class="etiqueta">B</text>

  <line x1="300" y1="40" x2="182" y2="160" class="camino"/>
  <line x1="182" y1="160" x2="90" y2="270" class="camino"/>
  <line x1="300" y1="40" x2="195" y2="160" class="camino"/>
  <line x1="195" y1="160" x2="90" y2="270" class="camino"/>

  <circle cx="182" cy="160" r="3" class="puntoRojo"/>
  <text x="152" y="152" class="etiqueta">C</text>
  <circle cx="195" cy="160" r="3" class="puntoRojo"/>
  <text x="200" y="180" class="etiqueta">C'</text>
</svg>
