<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220">
  <defs>
    <style>
      .curva { fill:none; stroke:#14315D; stroke-width:2; }
      .tangente { stroke:#9E1B32; stroke-width:1.4; }
      .puntoAzul { fill:#14315D; }
      .puntoRojo { fill:#9E1B32; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="300" height="220" fill="white"/>

  <!-- arco que representa la curva -->
  <path class="curva" d="M 60,170 Q 150,40 240,170"/>

  <!-- puntos M1 (izq) y M2 (der) sobre la curva -->
  <circle cx="90" cy="110" r="4" class="puntoAzul"/>
  <text x="62" y="108" class="etiqueta">M1</text>

  <circle cx="210" cy="110" r="4" class="puntoAzul"/>
  <text x="216" y="108" class="etiqueta">M2</text>

  <!-- cuerda M1-M2 -->
  <line x1="90" y1="110" x2="210" y2="110" class="tangente"/>

  <!-- tangentes M1-T y M2-T que se cortan en T -->
  <line x1="90" y1="110" x2="150" y2="190" class="tangente"/>
  <line x1="210" y1="110" x2="150" y2="190" class="tangente"/>
  <circle cx="150" cy="190" r="4" class="puntoRojo"/>
  <text x="156" y="205" class="etiquetaRoja">T</text>
</svg>
