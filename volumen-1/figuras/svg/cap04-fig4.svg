<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300">
  <defs>
    <style>
      .espiral { fill:none; stroke:#14315D; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
      .eje { stroke:#4A4A4A; stroke-width:1; }
      .puntoAzul { fill:#14315D; }
      .puntoRojo { fill:#9E1B32; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:17px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="340" height="300" fill="white"/>

  <!-- ejes X, Y por el origen O -->
  <line x1="10" y1="150" x2="330" y2="150" class="eje"/>
  <line x1="150" y1="10" x2="150" y2="290" class="eje"/>
  <text x="320" y="146" class="etiqueta">X</text>
  <text x="156" y="22" class="etiqueta">Y</text>

  <!-- rama de v positivo, espiral hacia A -->
  <path class="espiral" d="M 150,150
    C 190,135 225,118 233.7,139.0
    C 245,168 275,90 282.6,75.5
    C 290,60 240,15 225.7,31.4
    C 212,47 250,85 233.0,91.6
    C 220,96 222,48 227.8,44.7
    C 233,42 258,58 240,63" />

  <!-- rama de v negativo, espiral hacia A' (simetrica respecto a O) -->
  <path class="espiral" d="M 150,150
    C 110,165 75,182 66.3,161.0
    C 55,132 25,210 17.4,224.5
    C 10,240 60,285 74.3,268.6
    C 88,252 50,214 67.0,208.4
    C 80,203 78,251 72.2,255.3
    C 67,258 42,242 60,237" />

  <!-- origen O -->
  <circle cx="150" cy="150" r="3.5" class="puntoAzul"/>
  <text x="156" y="166" class="etiqueta">O</text>

  <!-- puntos asintoticos A y A' -->
  <circle cx="236" cy="63" r="4" class="puntoRojo"/>
  <text x="244" y="60" class="etiquetaRoja">A</text>

  <circle cx="59" cy="238" r="4" class="puntoRojo"/>
  <text x="25" y="246" class="etiquetaRoja">A'</text>

</svg>
