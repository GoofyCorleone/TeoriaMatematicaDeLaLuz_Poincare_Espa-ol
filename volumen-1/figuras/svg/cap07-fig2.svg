<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="340" viewBox="0 0 380 340">
  <defs>
    <style>
      .linea { stroke:#14315D; stroke-width:1.6; }
      .construccion { stroke:#9E1B32; stroke-width:1.3; stroke-dasharray:5,4; }
      .interfaz { stroke:#4A4A4A; stroke-width:1.1; }
      .puntoAzul { fill:#14315D; }
      .punto { fill:#9E1B32; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="380" height="340" fill="white"/>

  <!-- plano de separacion (de perfil) -->
  <line x1="30" y1="300" x2="330" y2="300" class="interfaz"/>
  <text x="20" y="320" class="etiqueta">F</text>
  <line x1="60" y1="300" x2="100" y2="340" class="interfaz"/>

  <!-- punto O, origen comun de los tres rayos -->
  <circle cx="160" cy="210" r="3.5" class="puntoAzul"/>
  <text x="140" y="228" class="etiqueta">O</text>

  <!-- rayo OI (vibracion incidente) -->
  <line x1="160" y1="210" x2="90" y2="80" class="linea"/>
  <circle cx="90" cy="80" r="3" class="puntoAzul"/>
  <text x="70" y="72" class="etiqueta">I</text>

  <!-- rayo OR (vibracion reflejada = suma geometrica de OI y OR') -->
  <line x1="160" y1="210" x2="290" y2="60" class="linea"/>
  <circle cx="290" cy="60" r="3" class="punto"/>
  <text x="298" y="56" class="etiquetaRoja">R</text>

  <!-- rayo OR' (vibracion refractada) -->
  <line x1="160" y1="210" x2="230" y2="140" class="construccion"/>
  <circle cx="230" cy="140" r="3" class="punto"/>
  <text x="238" y="136" class="etiquetaRoja">R'</text>

  <!-- paralelogramo auxiliar: OI, OR' y su diagonal OR -->
  <line x1="90" y1="80" x2="290" y2="60" class="construccion"/>
  <line x1="230" y1="140" x2="290" y2="60" class="construccion"/>

  <!-- punto F' auxiliar cerca de R' -->
  <circle cx="230" cy="230" r="3" class="puntoAzul"/>
  <text x="238" y="248" class="etiqueta">F'</text>
  <line x1="230" y1="140" x2="230" y2="230" class="construccion"/>
</svg>
