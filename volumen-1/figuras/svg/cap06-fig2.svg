<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260">
  <defs>
    <style>
      .plano { stroke:#14315D; stroke-width:2; }
      .onda { fill:none; stroke:#9E1B32; stroke-width:1.5; stroke-dasharray:5,4; }
      .puntoAzul { fill:#14315D; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family:'CMU Serif','Georgia',serif; font-size:15px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="420" height="260" fill="white"/>

  <!-- plano de onda PP' -->
  <line x1="110" y1="30" x2="110" y2="230" class="plano"/>
  <text x="95" y="24" class="etiqueta">P</text>
  <text x="95" y="246" class="etiqueta">P'</text>

  <!-- plano de onda QQ' -->
  <line x1="310" y1="30" x2="310" y2="230" class="plano"/>
  <text x="300" y="24" class="etiqueta">Q</text>
  <text x="300" y="246" class="etiqueta">Q'</text>

  <!-- puntos O, O' sobre PP' -->
  <circle cx="110" cy="100" r="3.5" class="puntoAzul"/>
  <text x="90" y="95" class="etiqueta">O</text>
  <circle cx="110" cy="170" r="3.5" class="puntoAzul"/>
  <text x="90" y="185" class="etiqueta">O'</text>

  <!-- ondas elementales S, S' tangentes a QQ' -->
  <circle cx="110" cy="100" r="100" class="onda"/>
  <circle cx="110" cy="170" r="100" class="onda"/>
  <text x="330" y="96" class="etiquetaRoja">S</text>
  <text x="330" y="176" class="etiquetaRoja">S'</text>
</svg>
