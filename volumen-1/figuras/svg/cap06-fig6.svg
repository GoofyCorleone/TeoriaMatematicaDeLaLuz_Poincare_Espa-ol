<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320">
  <defs>
    <style>
      .superficie { fill:none; stroke:#14315D; stroke-width:2.2; }
      .eje { stroke:#4A4A4A; stroke-width:1; }
      .puntoAzul { fill:#14315D; }
      .etiqueta { font-family:'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
    </style>
  </defs>
  <rect width="360" height="320" fill="white"/>

  <!-- ejes x, y -->
  <line x1="40" y1="260" x2="320" y2="260" class="eje"/>
  <text x="326" y="264" class="etiqueta">x</text>
  <line x1="60" y1="300" x2="200" y2="40" class="eje"/>
  <text x="195" y="30" class="etiqueta">y</text>

  <!-- origen O -->
  <circle cx="120" cy="220" r="3" class="puntoAzul"/>
  <text x="100" y="236" class="etiqueta">O</text>

  <!-- hoja compuesta (forma de "petalo" caracteristica de la cuartica) -->
  <path d="M 120,220
           C 90,160 100,90 160,70
           C 230,50 300,110 290,180
           C 282,235 230,260 180,250
           C 150,244 128,235 120,220 Z"
        class="superficie"/>

  <!-- segundo petalo mas pequeño, hoja interior -->
  <path d="M 120,220
           C 140,180 175,150 210,155
           C 245,160 260,195 240,220
           C 220,245 180,250 150,238
           C 132,231 122,226 120,220 Z"
        class="superficie"/>
</svg>
