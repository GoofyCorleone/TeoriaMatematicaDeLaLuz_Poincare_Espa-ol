<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
  <defs>
    <style>
      .curva { fill:none; stroke:#14315D; stroke-width:2.2; }
      .eje { stroke:#4A4A4A; stroke-width:1.2; }
      .rayo { stroke:#9E1B32; stroke-width:1.4; stroke-dasharray:5,4; }
      .punto { fill:#9E1B32; }
      .puntoAzul { fill:#14315D; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="420" height="320" fill="white"/>

  <!-- eje A-G -->
  <line x1="50" y1="230" x2="380" y2="230" class="eje"/>
  <text x="34" y="236" class="etiqueta">A</text>
  <text x="386" y="236" class="etiqueta">G</text>

  <!-- curva del frente de onda A-M-F-C -->
  <path d="M 50,230 C 110,120 150,90 200,80 S 250,60 260,55" class="curva"/>
  <circle cx="150" cy="112" r="3.5" class="puntoAzul"/>
  <text x="156" y="108" class="etiqueta">M</text>
  <circle cx="225" cy="68" r="3.5" class="puntoAzul"/>
  <text x="231" y="64" class="etiqueta">F</text>
  <circle cx="260" cy="55" r="3.5" class="puntoAzul"/>
  <text x="266" y="52" class="etiqueta">C</text>

  <!-- punto P -->
  <circle cx="95" cy="275" r="4" class="punto"/>
  <text x="78" y="294" class="etiquetaRoja">P</text>

  <!-- rayos P-M y P-C -->
  <line x1="95" y1="275" x2="150" y2="112" class="rayo"/>
  <line x1="95" y1="275" x2="260" y2="55" class="rayo"/>
</svg>
