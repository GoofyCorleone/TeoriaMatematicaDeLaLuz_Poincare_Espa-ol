<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300">
  <defs>
    <style>
      .contorno { fill:none; stroke:#14315D; stroke-width:2.2; }
      .division { fill:none; stroke:#9E1B32; stroke-width:1.6; stroke-dasharray:7,5; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:20px; fill:#14315D; font-style:italic; }
      .etiquetaS { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
    </style>
  </defs>
  <rect width="360" height="300" fill="white"/>

  <!-- contorno del volumen total -->
  <path d="M 180,30
           C 250,30 320,90 320,150
           C 320,215 250,270 180,270
           C 110,270 40,215 40,150
           C 40,90 110,30 180,30 Z" class="contorno"/>

  <!-- superficie interior S que separa R de R' -->
  <path d="M 180,40
           C 160,80 200,120 170,150
           C 145,175 195,210 180,260" class="division"/>
  <text x="252" y="158" class="etiquetaS">S</text>

  <text x="110" y="158" class="etiqueta">R</text>
  <text x="235" y="110" class="etiqueta">R'</text>
</svg>
