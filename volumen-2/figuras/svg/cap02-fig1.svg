<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340">
  <defs>
    <style>
      .plano { stroke:#14315D; stroke-width:2.2; }
      .planoZ { stroke:#14315D; stroke-width:1.4; stroke-dasharray:6,4; }
      .punto { fill:#9E1B32; }
      .puntoAzul { fill:#14315D; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:17px; fill:#14315D; font-style:italic; }
      .etiquetaRoja { font-family: 'CMU Serif','Georgia',serif; font-size:17px; fill:#9E1B32; font-style:italic; }
      .etiquetaPlano { font-family: 'CMU Serif','Georgia',serif; font-size:14px; fill:#14315D; }
    </style>
  </defs>
  <rect width="480" height="340" fill="white"/>

  <!-- plano izquierdo z0+Vt: puntos A (arriba) y B (abajo) -->
  <line x1="110" y1="50" x2="110" y2="290" class="plano"/>
  <circle cx="110" cy="60" r="4" class="puntoAzul"/>
  <text x="90" y="45" class="etiqueta">A</text>
  <circle cx="110" cy="280" r="4" class="puntoAzul"/>
  <text x="90" y="310" class="etiqueta">B</text>
  <text x="80" y="325" class="etiquetaPlano">z = z&#8320;+Vt</text>

  <!-- plano intermedio z=Z: puntos C (arriba), D (abajo), M en medio -->
  <line x1="260" y1="50" x2="260" y2="290" class="planoZ"/>
  <circle cx="260" cy="60" r="4" class="puntoAzul"/>
  <text x="268" y="45" class="etiqueta">C</text>
  <circle cx="260" cy="280" r="4" class="puntoAzul"/>
  <text x="268" y="310" class="etiqueta">D</text>
  <circle cx="260" cy="165" r="4.5" class="punto"/>
  <text x="270" y="162" class="etiquetaRoja">M</text>
  <text x="225" y="325" class="etiquetaPlano">z = Z</text>

  <!-- plano derecho z1+Vt: puntos E (arriba) y F (abajo) -->
  <line x1="380" y1="50" x2="380" y2="290" class="plano"/>
  <circle cx="380" cy="60" r="4" class="puntoAzul"/>
  <text x="388" y="45" class="etiqueta">E</text>
  <circle cx="380" cy="280" r="4" class="puntoAzul"/>
  <text x="388" y="310" class="etiqueta">F</text>
  <text x="350" y="325" class="etiquetaPlano">z = z&#8321;+Vt</text>

  <!-- punto exterior m -->
  <circle cx="445" cy="165" r="4.5" class="punto"/>
  <text x="453" y="162" class="etiquetaRoja">m</text>
</svg>
