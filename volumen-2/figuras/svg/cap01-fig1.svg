<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <defs>
    <style>
      .visible { fill:none; stroke:#14315D; stroke-width:2; }
      .oculta { fill:none; stroke:#14315D; stroke-width:1.4; stroke-dasharray:5,4; }
      .vertice { fill:#9E1B32; }
      .etiqueta { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#14315D; font-style:italic; }
      .etiquetaR { font-family: 'CMU Serif','Georgia',serif; font-size:16px; fill:#9E1B32; font-style:italic; }
      .pie { font-family: 'CMU Serif','Georgia',serif; font-size:15px; fill:#14315D; }
    </style>
  </defs>
  <rect width="560" height="300" fill="white"/>

  <!-- ===================== Paralelepípedo sin deformar ===================== -->
  <!-- vértices: A top-left-front, B top-right-front, C top-left-back,
       D top-right-back, E bottom-left-front, F bottom-right-front,
       G bottom-left-back, H bottom-right-back -->
  <g transform="translate(40,40)">
    <!-- caras ocultas -->
    <line x1="40" y1="20" x2="120" y2="20" class="oculta"/>  <!-- C-D -->
    <line x1="40" y1="20" x2="40" y2="100" class="oculta"/>  <!-- C-G -->
    <line x1="40" y1="100" x2="0" y2="140" class="oculta"/>  <!-- G-E -->
    <line x1="40" y1="100" x2="120" y2="100" class="oculta"/><!-- G-H -->

    <!-- caras visibles -->
    <line x1="0" y1="60" x2="80" y2="60" class="visible"/>   <!-- A-B -->
    <line x1="0" y1="60" x2="0" y2="140" class="visible"/>   <!-- A-E -->
    <line x1="80" y1="60" x2="80" y2="140" class="visible"/> <!-- B-F -->
    <line x1="0" y1="140" x2="80" y2="140" class="visible"/> <!-- E-F -->
    <line x1="0" y1="60" x2="40" y2="20" class="visible"/>   <!-- A-C -->
    <line x1="80" y1="60" x2="120" y2="20" class="visible"/> <!-- B-D -->
    <line x1="40" y1="20" x2="120" y2="20" class="visible"/> <!-- C-D -->
    <line x1="80" y1="140" x2="120" y2="100" class="visible"/><!-- F-H -->
    <line x1="120" y1="20" x2="120" y2="100" class="visible"/><!-- D-H -->

    <circle cx="0" cy="60" r="3" class="vertice"/>
    <circle cx="80" cy="60" r="3" class="vertice"/>
    <circle cx="40" cy="20" r="3" class="vertice"/>
    <circle cx="120" cy="20" r="3" class="vertice"/>
    <circle cx="0" cy="140" r="3" class="vertice"/>
    <circle cx="80" cy="140" r="3" class="vertice"/>
    <circle cx="40" cy="100" r="3" class="vertice"/>
    <circle cx="120" cy="100" r="3" class="vertice"/>

    <text x="-14" y="55" class="etiqueta">A</text>
    <text x="86" y="55" class="etiqueta">B</text>
    <text x="30" y="14" class="etiqueta">C</text>
    <text x="126" y="14" class="etiqueta">D</text>
    <text x="-14" y="155" class="etiqueta">E</text>
    <text x="86" y="155" class="etiqueta">F</text>
    <text x="22" y="112" class="etiqueta">G</text>
    <text x="126" y="112" class="etiqueta">H</text>
    <text x="40" y="188" class="pie" text-anchor="middle">Fig. 1 — antes</text>
  </g>

  <!-- ===================== Paralelepípedo deformado (oblicuo) ===================== -->
  <g transform="translate(340,40)">
    <!-- caras ocultas -->
    <line x1="55" y1="10" x2="140" y2="25" class="oculta"/>
    <line x1="55" y1="10" x2="40" y2="95" class="oculta"/>
    <line x1="40" y1="95" x2="-10" y2="150" class="oculta"/>
    <line x1="40" y1="95" x2="125" y2="110" class="oculta"/>

    <!-- caras visibles -->
    <line x1="0" y1="55" x2="90" y2="70" class="visible"/>
    <line x1="0" y1="55" x2="-10" y2="150" class="visible"/>
    <line x1="90" y1="70" x2="75" y2="160" class="visible"/>
    <line x1="-10" y1="150" x2="75" y2="160" class="visible"/>
    <line x1="0" y1="55" x2="55" y2="10" class="visible"/>
    <line x1="90" y1="70" x2="140" y2="25" class="visible"/>
    <line x1="55" y1="10" x2="140" y2="25" class="visible"/>
    <line x1="75" y1="160" x2="125" y2="110" class="visible"/>
    <line x1="140" y1="25" x2="125" y2="110" class="visible"/>

    <circle cx="0" cy="55" r="3" class="vertice"/>
    <circle cx="90" cy="70" r="3" class="vertice"/>
    <circle cx="55" cy="10" r="3" class="vertice"/>
    <circle cx="140" cy="25" r="3" class="vertice"/>
    <circle cx="-10" cy="150" r="3" class="vertice"/>
    <circle cx="75" cy="160" r="3" class="vertice"/>
    <circle cx="40" cy="95" r="3" class="vertice"/>
    <circle cx="125" cy="110" r="3" class="vertice"/>

    <text x="-16" y="50" class="etiquetaR">A'</text>
    <text x="96" y="68" class="etiquetaR">B'</text>
    <text x="45" y="4" class="etiquetaR">C'</text>
    <text x="146" y="22" class="etiquetaR">D'</text>
    <text x="-28" y="152" class="etiquetaR">E'</text>
    <text x="80" y="178" class="etiquetaR">F'</text>
    <text x="22" y="108" class="etiquetaR">G'</text>
    <text x="131" y="108" class="etiquetaR">H'</text>
    <text x="60" y="198" class="pie" text-anchor="middle">Fig. 1 — después</text>
  </g>
</svg>
